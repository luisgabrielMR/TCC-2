services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17@sha256:0027bef26712baaee437a4ea48fdf3d2d2e2bc5f0d81615374408ca320f3c7e3}
    container_name: tcc_benchmark_postgres
    # Cota maxima, nao reserva exclusiva: o valor efetivo e validado pelo preflight.
    cpus: 1.0
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-benchmark_db}
      POSTGRES_USER: ${POSTGRES_USER:-benchmark_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-benchmark_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./database:/benchmark/database:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-benchmark_user} -d ${POSTGRES_DB:-benchmark_db}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - benchmark

  postgres-exporter:
    image: ${POSTGRES_EXPORTER_IMAGE:-prometheuscommunity/postgres-exporter:v0.15.0@sha256:386b12d19eab2a37d7cd8ca8b4c7491cc7a830d9581f49af6c98a393da9605e6}
    container_name: tcc_benchmark_postgres_exporter
    profiles: ["monitoring"]
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-benchmark_user}:${POSTGRES_PASSWORD:-benchmark_password}@postgres:5432/${POSTGRES_DB:-benchmark_db}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9187:9187"
    networks:
      - benchmark

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3}
    container_name: tcc_benchmark_prometheus
    profiles: ["monitoring"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - benchmark

  benchmark-results-exporter:
    image: ${PYTHON_IMAGE:-python:3.12-slim@sha256:dd29372629eeba2dd003fd9e9d35a5b8236c44727875a0364254b5127af88e65}
    container_name: tcc_benchmark_results_exporter
    profiles: ["monitoring"]
    command: ["python", "/app/results_exporter.py", "--results", "/results", "--port", "9101"]
    volumes:
      - ./monitoring/results_exporter.py:/app/results_exporter.py:ro
      - ./results:/results:ro
    ports:
      - "127.0.0.1:9101:9101"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9101/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - benchmark

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.3.0@sha256:a0f881232a6fb71a0554a47d0fe2203b6888fe77f4cefb7ea62bed7eb54e13c3}
    container_name: tcc_benchmark_grafana
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/benchmark-overview.json
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    networks:
      - benchmark

  cadvisor:
    image: ${CADVISOR_IMAGE:-gcr.io/cadvisor/cadvisor:v0.49.1@sha256:3cde6faf0791ebf7b41d6f8ae7145466fed712ea6f252c935294d2608b1af388}
    container_name: tcc_benchmark_cadvisor
    profiles: ["monitoring"]
    privileged: true
    command:
      - "--containerd-namespace=moby"
      - "--docker=unix:///var/run/cadvisor-disabled-docker.sock"
      - "--allow_dynamic_housekeeping=false"
      - "--housekeeping_interval=1s"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8080:8080"
    networks:
      - benchmark

  locust:
    image: ${LOCUST_IMAGE:-locustio/locust:2.32.6@sha256:99278f4b23e2353e7a93b84f9c270700c8193b90c1611f5c2a1817a111c22ee3}
    container_name: tcc_benchmark_locust
    profiles: ["load"]
    # Quatro processos Locust, um por core: um unico processo gevent satura um
    # core em torno de 900 req/s e viraria o gargalo antes das APIs rapidas.
    cpus: 4.0
    working_dir: /mnt/locust
    environment:
      PAYLOAD_DIR: /mnt/payloads
    volumes:
      - ./load-tests/locust:/mnt/locust:ro
      - ./scripts:/mnt/scripts:ro
      - ./common/payloads:/mnt/payloads:ro
      - ./results:/mnt/results
    command: ["-f", "locustfile.py", "--host", "${LOCUST_HOST:-http://host.docker.internal:8000}"]
    ports:
      - "8089:8089"
    networks:
      - benchmark

  python-api:
    profiles: ["python"]
    build:
      context: ./apps/python-api
    container_name: tcc_benchmark_python_api
    cpus: 2.0
    environment: &api-environment
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-benchmark_db}
      POSTGRES_USER: ${POSTGRES_USER:-benchmark_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-benchmark_password}
      DB_POOL_MIN: ${DB_POOL_MIN:-1}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      DB_POOL_ACQUIRE_TIMEOUT_SECONDS: ${DB_POOL_ACQUIRE_TIMEOUT_SECONDS:-10}
      DB_POOL_IDLE_TIMEOUT_SECONDS: ${DB_POOL_IDLE_TIMEOUT_SECONDS:-60}
      DB_POOL_MAX_LIFETIME_SECONDS: ${DB_POOL_MAX_LIFETIME_SECONDS:-1800}
    ports:
      - "${API_EXTERNAL_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - benchmark

  node-api:
    profiles: ["node"]
    build:
      context: ./apps/node-api
    container_name: tcc_benchmark_node_api
    cpus: 2.0
    environment:
      <<: *api-environment
    ports:
      - "${API_EXTERNAL_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - benchmark

  java-api:
    profiles: ["java"]
    build:
      context: ./apps/java-api
    container_name: tcc_benchmark_java_api
    cpus: 2.0
    environment:
      <<: *api-environment
    ports:
      - "${API_EXTERNAL_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - benchmark

  go-api:
    profiles: ["go"]
    build:
      context: ./apps/go-api
    container_name: tcc_benchmark_go_api
    cpus: 2.0
    environment:
      <<: *api-environment
    ports:
      - "${API_EXTERNAL_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - benchmark

  dotnet-api:
    profiles: ["dotnet"]
    build:
      context: ./apps/dotnet-api
    container_name: tcc_benchmark_dotnet_api
    cpus: 2.0
    environment:
      <<: *api-environment
    ports:
      - "${API_EXTERNAL_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - benchmark

networks:
  benchmark:
    name: tcc_benchmark_network

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
